user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Referer → Bokeh container for root /static/js/... (legacy visstore global /static/ proxy).
    map $http_referer $sc_bokeh_static_host {
        default dashboard_openvisusslice;
        "~*/dashboard/3DVTK"     dashboard_3dvtk;
        "~*/3DVTK"               dashboard_3dvtk;
        "~*/dashboard/OpenVisusSlice" dashboard_openvisusslice;
        "~*/OpenVisusSlice"      dashboard_openvisusslice;
        "~*/dashboard/darkmatter" dashboard_darkmatter;
        "~*/darkmatter"          dashboard_darkmatter;
        "~*/dashboard/ORNL_CHESS_strain" dashboard_ornl_chess_strain;
        "~*/ORNL_CHESS_strain"   dashboard_ornl_chess_strain;
        "~*/dashboard/4d_dashboardopt" dashboard_4d_dashboardopt;
        "~*/4d_dashboardopt"     dashboard_4d_dashboardopt;
        "~*/dashboard/magicscan" dashboard_magicscan;
    }
    map $http_referer $sc_bokeh_static_port {
        default 8054;
        "~*/dashboard/3DVTK"     8051;
        "~*/3DVTK"               8051;
        "~*/dashboard/OpenVisusSlice" 8054;
        "~*/OpenVisusSlice"      8054;
        "~*/dashboard/darkmatter" 8058;
        "~*/darkmatter"          8058;
        "~*/dashboard/ORNL_CHESS_strain" 8059;
        "~*/ORNL_CHESS_strain"   8059;
        "~*/dashboard/4d_dashboardopt" 8057;
        "~*/4d_dashboardopt"     8057;
        "~*/dashboard/magicscan" 8053;
    }

    # Server blocks only (scientistcloud-server.conf from templates/ via container entrypoint).
    # *_dashboard.conf are location blocks — live under conf.d/dashboards/ and are included
    # inside server { } via includes/scientistcloud-locations.conf. Do not mount them at conf.d/*.conf.
    include /etc/nginx/conf.d/*.conf;
}

# Dashboard login gate — include once inside the main HTTPS server block.
# Unauthenticated /dashboard/* requests redirect to login, then return to the original URL.

location = /_sc_dashboard_auth {
    internal;
    rewrite ^ /api/dashboard-auth-check.php break;
    set $upstream_portal "scientistcloud-portal";
    proxy_pass http://$upstream_portal:8080;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location @sc_dashboard_login {
    return 302 $scheme://$host/portal/api/dashboard-login-redirect.php?target=$request_uri;
}

# Nginx location configuration for darkmatter dashboard
# Generated from dashboard.json configuration
# DO NOT EDIT MANUALLY - Regenerate using scripts/generate_nginx_config.sh
#
# NOTE: This file contains location blocks that should be included in the main server block.
# The resolver directive must be in the server block (already added to main server block).

# Dashboard proxy configuration
# Handle both with and without trailing slash to preserve query parameters
location /dashboard/darkmatter {
    # Redirect to version with trailing slash, preserving query parameters
    return 301 $scheme://$host/dashboard/darkmatter/$is_args$args;
}

location /dashboard/darkmatter/ {
    # Use variable to defer hostname resolution (prevents startup errors if containers aren't up)
    set $upstream_host "dashboard_darkmatter";
    set $upstream_port "8058";
    # Construct proxy URL first - must be set before rewrite
    set $proxy_url "http://$upstream_host:$upstream_port";
    # When using variables in proxy_pass, we need to rewrite the path to match the app path
    # This ensures /dashboard/OpenVisusSlice/ws becomes /OpenVisusSlice/ws
    # Use regex to capture everything after the nginx path and rewrite to app path
    rewrite ^/dashboard/darkmatter/(.*)$ /darkmatter/$1 break;
    # When using variables in proxy_pass, query params are preserved automatically
    proxy_pass $proxy_url;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    
    # Cookie forwarding for authentication
    proxy_set_header Cookie $http_cookie;
    # Cookie path should match the app path, not the nginx path
    # This ensures cookies set by the app are accessible at the app's path
    proxy_cookie_path / /darkmatter/;
    
    # WebSocket support for Bokeh/Dash
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    # Connection header for WebSocket upgrade
    # Note: The main nginx config should have: map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # If that map exists, use: proxy_set_header Connection $connection_upgrade;
    # Otherwise, for Bokeh apps that always use WebSockets, we can set to upgrade
    proxy_set_header Connection "upgrade";
    
    # Bokeh/Dash-specific headers
    # Use APP_PATH (without trailing slash) to match the app's actual path, not the nginx path
    # This matches the working dataExplorer pattern: X-Forwarded-Prefix /dataExplorer
    proxy_set_header X-Forwarded-Prefix /darkmatter;
    proxy_redirect off;
    
    # Timeouts for long-running requests
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    
    # Buffer settings
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    
    # CORS headers (if enabled)
        # CORS disabled
}

# Static files (if applicable)
# Static files (Bokeh - uses static/ at root level, not app path)
location /dashboard/darkmatter/static/ {
    # Use variable to defer hostname resolution
    set $upstream_host "dashboard_darkmatter";
    set $upstream_port "8058";
    # Preserve full static path suffix after /dashboard/darkmatter/static/
    rewrite ^/dashboard/darkmatter/static/(.*)$ /static/$1 break;
    proxy_pass http://$upstream_host:$upstream_port;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Panel static files (Panel extensions need to be served)
# Panel serves its static files from /static/extensions/panel/
location /static/extensions/panel/ {
    # Proxy to the dashboard container for Panel static files
    set $upstream_host "dashboard_darkmatter";
    set $upstream_port "8058";
    proxy_pass http://$upstream_host:$upstream_port/static/extensions/panel/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Cache Panel static files
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Panel bundled files (Panel serves bundled resources from /static/extensions/panel/bundled/)
location /dashboard/darkmatter/static/extensions/panel/ {
    # Proxy to the dashboard container
    set $upstream_host "dashboard_darkmatter";
    set $upstream_port "8058";
    # Rewrite to remove nginx path prefix and pass to container
    rewrite ^/dashboard/darkmatter/static/extensions/panel/(.*)$ /static/extensions/panel/$1 break;
    proxy_pass http://$upstream_host:$upstream_port;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Cache Panel static files
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Health check endpoint (if specified)
    location /dashboard/darkmatter/health {
        # Use variable to defer hostname resolution (prevents startup errors if containers aren't up)
        set $upstream_host "dashboard_darkmatter";
        set $upstream_port "8058";
        proxy_pass http://$upstream_host:$upstream_port/darkmatter/health;
        proxy_set_header Host $host;
        access_log off;
    }

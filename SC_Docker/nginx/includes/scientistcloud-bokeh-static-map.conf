# Maps site-root /static/js/... Referer to the Bokeh container that served the page.
# Legacy visstore default.conf.https used one global:
#   location /static/ { proxy_pass http://visstore_bokeh:5006/static/; }
# Panel stayed on dashboard_3dvtk via the more-specific /static/extensions/panel/ block.
# SC has many Bokeh dashboards; each ships its own /static/ tree at the container root.
#
# Use a single host:port upstream (no URI suffix on proxy_pass). Variable proxy_pass
# with a path suffix breaks URI rewrite and returns 403 on /static/js/bokeh.min.js.

map $http_referer $sc_bokeh_static_upstream {
    default dashboard_openvisusslice:8054;
    "~*/dashboard/3DVTK"              dashboard_3dvtk:8051;
    "~*/3DVTK"                        dashboard_3dvtk:8051;
    "~*/dashboard/OpenVisusSlice"     dashboard_openvisusslice:8054;
    "~*/OpenVisusSlice"               dashboard_openvisusslice:8054;
    "~*/dashboard/darkmatter"         dashboard_darkmatter:8058;
    "~*/darkmatter"                   dashboard_darkmatter:8058;
    "~*/dashboard/ORNL_CHESS_strain" dashboard_ornl_chess_strain:8059;
    "~*/ORNL_CHESS_strain"            dashboard_ornl_chess_strain:8059;
    "~*/dashboard/4d_dashboardopt"    dashboard_4d_dashboardopt:8057;
    "~*/4d_dashboardopt"              dashboard_4d_dashboardopt:8057;
    "~*/dashboard/4d_dashboardLite"   dashboard_4d_dashboardlite:8056;
    "~*/dashboard/4d_dashboard"      dashboard_4d_dashboard:8052;
    "~*/dashboard/magicscan"          dashboard_magicscan:8053;
    "~*/dashboard/3DPlotly"           dashboard_3dplotly:8060;
    "~*/plotly"                       dashboard_3dplotly:8060;
}

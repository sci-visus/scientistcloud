# ScientistCloud edge locations (included inside server { } on :80 and :443).
# Legacy visstore_user, visstore_bokeh_*, dataExplorer, /plotly/, etc. are intentionally omitted.

    # Dozzle is optional — variable + resolver in server block defers DNS (nginx won't crash if absent)
    set $upstream_dozzle "visstore_dozzle";

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Default site — SC portal (no visstore_user at /)
    location = / {
        return 301 $scheme://$host/portal/;
    }

    # ScientistCloud Portal API endpoints (MUST come before Dozzle /api/)
    location ~ ^/api/(dataset-details|dataset-status)\.php {
        proxy_pass http://$portal_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/[^/]+\.php$ {
        proxy_pass http://$portal_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SCLib — MUST precede generic /api/ (Dozzle). ^~ stops other prefix stealing.
    location ^~ /api/auth/ {
        set $upstream_auth "sclib_auth";
        proxy_pass http://$upstream_auth:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_intercept_errors on;
        error_page 502 503 = @sclib_unavailable;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    location ^~ /api/upload/ {
        set $upstream_fastapi "sclib_fastapi";
        proxy_pass http://$upstream_fastapi:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_intercept_errors on;
        error_page 502 503 = @sclib_unavailable;
        client_max_body_size 10G;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    location ^~ /api/v1/ {
        set $upstream_fastapi "sclib_fastapi";
        proxy_pass http://$upstream_fastapi:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_intercept_errors on;
        error_page 502 503 = @sclib_unavailable;
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # Dozzle API (fallback for /api/ paths not matching portal or SCLib)
    location /api/ {
        proxy_pass http://$upstream_dozzle:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /manifest.webmanifest {
        proxy_pass http://$upstream_dozzle:8080/manifest.webmanifest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /apple-touch-icon.png {
        proxy_pass http://$upstream_dozzle:8080/apple-touch-icon.png;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dozzle/ {
        proxy_pass http://$upstream_dozzle:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect / /dozzle/;
        proxy_cookie_path / /dozzle/;
    }

    # Dozzle static assets (not /portal/assets/)
    location /assets/ {
        proxy_pass http://$upstream_dozzle:8080/assets/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Panel static for dashboard_3dvtk (root /static/extensions/panel/ URLs)
    location /static/extensions/panel/ {
        set $upstream_3dvtk "dashboard_3dvtk";
        proxy_pass http://$upstream_3dvtk:8051/static/extensions/panel/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/health/ {
        set $upstream_auth "sclib_auth";
        proxy_pass http://$upstream_auth:8001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/upload-health/ {
        set $upstream_fastapi "sclib_fastapi";
        proxy_pass http://$upstream_fastapi:5001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @sclib_unavailable {
        add_header Content-Type application/json;
        return 503 '{"error": "SCLib services are not available", "message": "ScientistCloud services are currently offline. Please contact your administrator or try again later.", "status": 503}';
    }

    # Dashboard location blocks (auth gate + per-dashboard configs)
    include /etc/nginx/conf.d/dashboards/dashboard_auth_gate.conf;
    include /etc/nginx/conf.d/dashboards/*_dashboard.conf;

    location ~ ^/portal/api/ {
        rewrite ^/portal/api/(.*)$ /api/$1 break;
        proxy_pass http://$portal_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location /portal/ {
        rewrite ^/portal/(.*)$ /$1 break;
        proxy_pass http://$portal_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 300s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location /portal/assets/ {
        rewrite ^/portal/assets/(.*)$ /assets/$1 break;
        proxy_pass http://$portal_upstream:8080;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /portal/health {
        rewrite ^/portal/health$ /test-simple.php break;
        proxy_pass http://$portal_upstream:8080;
    }

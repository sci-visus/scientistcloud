# ScientistCloud edge locations (included inside server { } on :80 and :443).
#
# Legacy source of truth: VisusDataPortalPrivate/Docker/nginx/conf.d/default.conf.https
# (visstore_nginx). SC 2.0 keeps the same routing *patterns*; containers/paths differ:
#
#   Legacy default.conf.https              SC 2.0 scientistcloud-locations.conf
#   ---------------------------            -------------------------------------
#   visstore_bokeh:5006  /static/          dashboard_openvisusslice:8054/static/
#   dashboard_3dvtk:8051 /static/extensions/panel/   (same; literal proxy_pass)
#   visstore_bokeh_dashboard /dataExplorer/   /dashboard/OpenVisusSlice/  (generated conf)
#   visstore_plotly /plotly/               /dashboard/3DPlotly/ or plotly path (generated)
#   location /  → visstore_user          location / → 301 /portal/  (SC portal only)
#
# Critical: global /static/ and /static/extensions/panel/ use literal proxy_pass
# hostnames (no $variables). Variable proxy_pass breaks URI rewrite (403 on bokeh.min.js).
#
# Per-dashboard blocks: conf.d/dashboards/*_dashboard.conf (from generate_nginx_config.sh).

    # Dozzle is optional — variable + resolver in server block defers DNS (nginx won't crash if absent)
    set $upstream_dozzle "visstore_dozzle";

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Default site — SC portal (no visstore_user at /)
    location = / {
        return 301 $scheme://$host/portal/;
    }

    # ScientistCloud Portal API endpoints (MUST come before Dozzle /api/)
    location ~ ^/api/(dataset-details|dataset-status)\.php {
        proxy_pass http://$portal_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/[^/]+\.php$ {
        proxy_pass http://$portal_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SCLib — MUST precede generic /api/ (Dozzle). ^~ stops other prefix stealing.
    location ^~ /api/auth/ {
        set $upstream_auth "sclib_auth";
        proxy_pass http://$upstream_auth:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_intercept_errors on;
        error_page 502 503 = @sclib_unavailable;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    location ^~ /api/upload/ {
        set $upstream_fastapi "sclib_fastapi";
        proxy_pass http://$upstream_fastapi:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_intercept_errors on;
        error_page 502 503 = @sclib_unavailable;
        client_max_body_size 10G;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    location ^~ /api/v1/ {
        set $upstream_fastapi "sclib_fastapi";
        proxy_pass http://$upstream_fastapi:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_intercept_errors on;
        error_page 502 503 = @sclib_unavailable;
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # Dozzle — ^~ prefix; DOZZLE_BASE=/dozzle (all assets under /dozzle/assets/, not /assets/)
    location ^~ /dozzle/ {
        set $dozzle_upstream "http://$upstream_dozzle:8080";
        proxy_pass $dozzle_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /dozzle;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect / /dozzle/;
        proxy_cookie_path / /dozzle/;
    }

    location = /dozzle {
        return 301 $scheme://$host/dozzle/;
    }

    # Dozzle bundle CSS references fonts as /assets/*.woff2 (site root, not /dozzle/assets/)
    location ^~ /assets/ {
        proxy_pass http://$upstream_dozzle:8080/assets/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Panel static (legacy visstore_nginx default.conf.https — literal proxy_pass, no variables).
    # Variable proxy_pass breaks URI rewrite and caused 403 on /static/js/bokeh.min.js.
    location ^~ /static/extensions/panel/ {
        proxy_pass http://dashboard_3dvtk:8051/static/extensions/panel/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Global Bokeh static (legacy: visstore_bokeh:5006/static/).
    # SC replacement: OpenVisusSlice container — same role as legacy dataExplorer/visstore_bokeh.
    # MUST use literal host in proxy_pass (not $variables) so /static/js/... maps correctly.
    location ^~ /static/ {
        proxy_pass http://dashboard_openvisusslice:8054/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/health/ {
        set $upstream_auth "sclib_auth";
        proxy_pass http://$upstream_auth:8001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/upload-health/ {
        set $upstream_fastapi "sclib_fastapi";
        proxy_pass http://$upstream_fastapi:5001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @sclib_unavailable {
        add_header Content-Type application/json;
        return 503 '{"error": "SCLib services are not available", "message": "ScientistCloud services are currently offline. Please contact your administrator or try again later.", "status": 503}';
    }

    # Dashboard location blocks (auth gate + per-dashboard configs)
    include /etc/nginx/conf.d/dashboards/dashboard_auth_gate.conf;
    include /etc/nginx/conf.d/dashboards/*_dashboard.conf;

    location ~ ^/portal/api/ {
        rewrite ^/portal/api/(.*)$ /api/$1 break;
        proxy_pass http://$portal_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location /portal/ {
        rewrite ^/portal/(.*)$ /$1 break;
        proxy_pass http://$portal_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 300s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location /portal/assets/ {
        rewrite ^/portal/assets/(.*)$ /assets/$1 break;
        proxy_pass http://$portal_upstream:8080;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /portal/health {
        rewrite ^/portal/health$ /test-simple.php break;
        proxy_pass http://$portal_upstream:8080;
    }
